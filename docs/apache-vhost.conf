# /etc/apache2/sites-available/gpc-reserve.conf
# Optional: only for a dedicated hostname such as reserve.groveparkcollective.com (see docs/DEPLOYMENT.md).
# Enable with:  a2enmod rewrite headers ssl && a2ensite gpc-reserve && systemctl reload apache2
# Get HTTPS with: certbot --apache -d reserve.groveparkcollective.com

<VirtualHost *:80>
    ServerName reserve.groveparkcollective.com
    DocumentRoot /var/www/gpc-reserve/public

    <Directory /var/www/gpc-reserve/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Photos uploaded by admins are images only: never execute anything here.
    <Directory /var/www/gpc-reserve/public/uploads>
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Everything outside /public (code, config, storage) is unreachable from the web
    # because DocumentRoot points at /public.

    ErrorLog ${APACHE_LOG_DIR}/gpc-reserve-error.log
    CustomLog ${APACHE_LOG_DIR}/gpc-reserve-access.log combined
</VirtualHost>
